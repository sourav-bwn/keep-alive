name: Keep Render services warm

on:
  schedule:
    # Runs every 10 minutes. The job itself reads config.json and only pings
    # inside the chosen window (IST). Best-effort only.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ping now even if outside the window or paused'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: render-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.json
          persist-credentials: false
      - name: Check endpoints when the schedule allows
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail
          enabled=$(jq -r '.enabled' config.json)
          start=$(jq -r '.start' config.json)
          end=$(jq -r '.end' config.json)
          rio_on=$(jq -r '.apps.rio' config.json)
          bot_on=$(jq -r '.apps.neotiabot' config.json)
          now=$(TZ=Asia/Kolkata date +%H:%M)
          echo "Now (IST): $now | window $start-$end | enabled=$enabled | force=$FORCE"
          if [ "$FORCE" != "true" ]; then
            if [ "$enabled" != "true" ]; then echo "Paused in config.json. Skipping."; exit 0; fi
            if [[ "$now" < "$start" || "$now" > "$end" ]]; then echo "Outside window. Skipping."; exit 0; fi
          fi
          ping_service() {
            local name="$1" url="$2"
            echo "Checking $name: $url"
            # GET only: no sign-in, queries, student data, or database mutations.
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 80 \
              --output /dev/null \
              --write-out "$name HTTP %{http_code} in %{time_total}s\n" \
              "$url"; then
              return 0
            else
              echo "::error::$name did not return a successful HTTP response"
              return 1
            fi
          }
          pids=()
          if [ "$rio_on" = "true" ]; then
            ping_service RIO https://rio-0znb.onrender.com/api/health & pids+=($!)
          else echo "RIO is switched off in config.json."; fi
          if [ "$bot_on" = "true" ]; then
            ping_service NeotiaBot https://college-admission-rag.onrender.com/ & pids+=($!)
          else echo "NeotiaBot is switched off in config.json."; fi
          result=0
          for p in "${pids[@]}"; do wait "$p" || result=1; done
          exit "$result"
