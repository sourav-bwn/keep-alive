name: Keep Render services warm

on:
  schedule:
    # Offset from the hour to reduce scheduling congestion. Best-effort only.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check RIO and NeotiaBot production endpoints
        shell: bash
        run: |
          set -uo pipefail
          ping_service() {
            local name="$1" url="$2"
            echo "Checking $name: $url"
            # GET only: no sign-in, queries, student data, or database mutations.
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 80 \
              --output /dev/null \
              --write-out "$name HTTP %{http_code} in %{time_total}s\n" \
              "$url"; then
              return 0
            else
              echo "::error::$name did not return a successful HTTP response"
              return 1
            fi
          }
          ping_service RIO https://rio-0znb.onrender.com/api/health &
          rio_pid=$!
          ping_service NeotiaBot https://college-admission-rag.onrender.com/ &
          bot_pid=$!
          result=0
          wait "$rio_pid" || result=1
          wait "$bot_pid" || result=1
          exit "$result"
